[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-research-repro"
version = "0.1.0"
description = "A minimal end-to-end reproduction scaffold for AI Scientist v1 style research agents."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.24.0",
  "datasets>=2.19.1",
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0",
  "jinja2>=3.1.0",
  "sqlalchemy>=2.0.0",
  "httpx>=0.27.0",
  "itsdangerous>=2.2.0",
  "cryptography>=42.0.0",
]

[project.scripts]
ai-research-repro = "ai_research_repro.cli:main"
ai-research-web = "ai_research_repro.webapp.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

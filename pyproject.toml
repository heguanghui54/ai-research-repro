[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-research-repro"
version = "0.1.0"
description = "A minimal low-cost reproduction scaffold inspired by the FML-bench benchmark workflow."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24.0",
  "openai>=1.30.0",
  "reportlab>=4.2.0",
]

[project.scripts]
ai-research-repro = "ai_research_repro.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

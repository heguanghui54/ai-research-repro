<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title or settings.app_name }}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='styles.css') }}">
  <script defer src="https://unpkg.com/htmx.org@1.9.12"></script>
</head>
<body>
  <div class="page-shell">
    <div class="backdrop backdrop-a"></div>
    <div class="backdrop backdrop-b"></div>
    <header class="topbar">
      <a class="brand" href="/">
        <span class="brand-mark">VS</span>
        <span>
          <strong>{{ settings.app_name }}</strong>
          <small>爆款视频工作台</small>
        </span>
      </a>
      <nav class="topnav">
        {% if user %}
          <a href="/dashboard">Dashboard</a>
          <a href="/projects/new">New Project</a>
          <a href="/settings">Integrations</a>
          {% if user.role == 'admin' %}<a href="/admin">Admin</a>{% endif %}
          <form action="/logout" method="post" class="inline-form">
            <button class="btn btn-ghost" type="submit">Logout</button>
          </form>
        {% else %}
          <a href="/login">Login</a>
          <a href="/register">Register</a>
        {% endif %}
      </nav>
    </header>
    <main class="container">
      {% block content %}{% endblock %}
    </main>
  </div>
</body>
</html>

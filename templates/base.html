<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title or settings.app_name }}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='styles.css') }}">
  <script defer src="https://unpkg.com/htmx.org@1.9.12"></script>
</head>
<body>
  <div class="page-shell">
    <div class="backdrop backdrop-a"></div>
    <div class="backdrop backdrop-b"></div>
    <header class="topbar">
      <a class="brand" href="/">
        <span class="brand-mark">VS</span>
        <span>
          <strong>{{ settings.app_name }}</strong>
          <small>爆款视频工作台</small>
        </span>
      </a>
      <nav class="topnav">
        {% if user %}
          <a href="/dashboard">首页</a>
          <a href="/publish-jobs">发布任务</a>
          <a href="/projects/new">新建项目</a>
          <a href="/settings">后台配置</a>
          {% if can_access_admin %}<a href="/admin">管理面板</a>{% endif %}
          <form action="/logout" method="post" class="inline-form">
            <button class="btn btn-ghost" type="submit">退出</button>
          </form>
        {% else %}
          <a href="/login">登录</a>
          <a href="/register">注册</a>
        {% endif %}
      </nav>
    </header>
    <main class="container">
      {% block content %}{% endblock %}
    </main>
  </div>
</body>
</html>

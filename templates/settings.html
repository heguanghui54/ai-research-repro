{% extends "base.html" %}
{% block content %}
<section class="page-head">
  <div>
    <div class="eyebrow">后台配置</div>
    <h1>管理员 API 配置中心</h1>
    <p class="lead">API key、基础地址和模型都保存在后台数据库里，不写死在代码里。Monica 已作为默认推荐项预填。</p>
  </div>
</section>

<section class="stack">
  {% for section in api_sections %}
    {% set item = section.current %}
    <form class="panel form-grid" method="post" action="/admin/api-config">
      <input type="hidden" name="provider" value="{{ section.provider }}">
      <div class="full panel-head">
        <h2>{{ section.label }}</h2>
        <p class="muted">{{ section.description }}</p>
      </div>
      <label>API key<input type="password" name="api_key" value="{{ item.api_key_enc if item else '' }}" placeholder="{{ section.api_key_placeholder }}"></label>
      <label>基础地址<input type="text" name="base_url" value="{{ item.base_url if item and item.base_url else section.base_url }}" placeholder="可留空"></label>
      <label>模型<input type="text" name="model" value="{{ item.model if item and item.model else section.model }}" placeholder="可留空"></label>
      <label class="full">额外配置 JSON<textarea name="extra_json" rows="5" placeholder='{}'>{{ item.settings | tojson(indent=2) if item else section.extra_json }}</textarea>
        <span class="muted">
          {% if section.provider == 'monica' %}
            Monica 默认建议把 `image_model`、`vision_model` 等放这里；例如 `{"image_model":"dall-e-3"}`。
          {% elif section.provider == 'heygen' %}
            HeyGen 在这里放 `avatar_id`、`voice_id`、`callback_url`。
          {% elif section.provider == 'multipost' %}
            MultiPost 可以在这里放 `publish_path` 等接口参数。
          {% else %}
            这里可以放这个服务所需的补充字段。
          {% endif %}
        </span>
      </label>
      <div class="full actions-row">
        <button class="btn btn-primary" type="submit">保存 {{ section.label }}</button>
      </div>
    </form>
  {% endfor %}
</section>
{% endblock %}

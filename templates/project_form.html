{% extends "base.html" %}
{% block content %}
<section class="page-head">
  <div>
    <div class="eyebrow">新建项目</div>
    <h1>创建一个可生产的视频工作区</h1>
    <p class="lead">把领域、参考链接和默认分发目标统一放到这里。</p>
  </div>
</section>
<form class="panel form-grid" method="post">
  <label>项目名称<input type="text" name="name" required></label>
  <label>领域<input type="text" name="niche" placeholder="金融 / 教育 / SaaS / 电商"></label>
  <label class="full">项目描述<textarea name="description" rows="5" placeholder="我们要生产什么类型的内容？"></textarea></label>
  <label class="full">参考链接<input type="url" name="reference_url" placeholder="粘贴一个爆款视频链接"></label>
  <label class="full">目标平台<input type="text" name="target_platforms" value="douyin,xiaohongshu,bilibili,youtube,tiktok"></label>
  <div class="full actions-row">
    <button class="btn btn-primary" type="submit">创建项目</button>
    <a class="btn btn-ghost" href="/dashboard">取消</a>
  </div>
</form>
{% endblock %}

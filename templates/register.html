{% extends "base.html" %}
{% block content %}
<section class="auth-grid">
  <div class="auth-copy">
    <div class="eyebrow">开始搭建</div>
    <h1>创建你的工作空间，开始批量生成视频。</h1>
    <p class="lead">注册后你可以创建项目、粘贴参考链接、生成脚本并自动出片。</p>
  </div>
  <form class="panel auth-form" method="post">
    <h2>注册</h2>
    {% if error %}<div class="alert">{{ error }}</div>{% endif %}
    <label>显示名称<input type="text" name="display_name" placeholder="你的工作室名称"></label>
    <label>邮箱<input type="email" name="email" required></label>
    <label>密码<input type="password" name="password" required></label>
    <button class="btn btn-primary" type="submit">创建账号</button>
    <p class="muted">已有账号？<a href="/login">去登录</a></p>
  </form>
</section>
{% endblock %}

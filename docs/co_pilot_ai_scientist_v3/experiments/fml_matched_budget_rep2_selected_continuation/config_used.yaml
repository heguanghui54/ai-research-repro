agent:
  ai_scientist_v2:
    debug_prob: 0.5
    execute_timeout: 2400
    max_debug_depth: 3
    max_stderr_output: 1500
    max_steps: 2
    num_ideas: 1
    num_parallel: 1
    num_reflections: 3
    stage_budgets:
    - 1.0
    - 0.0
    - 0.0
    - 0.0
  model: deepseek-chat
  provider: DeepSeek
  type: ai_scientist_v2
benchmark:
  name: Causality_causalml
metrics:
  include_datasets:
  - ihdp_test
  include_metrics:
  - mae_mean
  optimization_direction: null
  per_metric_direction:
    abs_pct_error_of_ate_mean: lower
    ate_mean: null
    auuc_mean: higher
    kl_divergence_mean: lower
    mae_mean: lower
    mse_mean: lower

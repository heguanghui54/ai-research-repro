agent:
  ai_scientist_v2:
    debug_prob: 0.5
    execute_timeout: 2400
    max_debug_depth: 3
    max_stderr_output: 1500
    max_steps: 2
    num_ideas: 2
    num_parallel: 2
    num_reflections: 3
    stage_budgets:
    - 0.1
    - 0.2
    - 0.5
    - 0.2
  model: deepseek-chat
  provider: DeepSeek
  type: ai_scientist_v2
benchmark:
  name: Fairness_fairlearn
metrics:
  include_datasets:
  - adult
  include_metrics:
  - abs_demographic_parity_diff_mean
  optimization_direction: null
  per_metric_direction:
    abs_demographic_parity_diff_mean: lower
    abs_equalized_odds_diff_mean: lower
    accuracy_mean: higher
    balanced_accuracy_mean: higher
